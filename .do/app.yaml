# DigitalOcean App Platform spec for the landing page (static site from site/).
# Create the app from this spec: doctl apps create --spec .do/app.yaml
# or pick the same values in the control panel.
name: vexa-site
domains:
  - domain: vexacode.ru
    type: PRIMARY
static_sites:
  - name: site
    github:
      repo: traden0de/vexa
      branch: main
      deploy_on_push: true
    source_dir: site
    build_command: npm ci && npm run build
    output_dir: out
    error_document: 404.html
    envs:
      - key: SITE_URL
        scope: BUILD_TIME
        value: https://vexacode.ru
