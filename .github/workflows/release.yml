name: Release

# Push a tag vX.Y.Z (matching package.json) to build the Windows installer
# and publish a GitHub release. Installed apps pick it up via latest.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win --publish never
      # One gh call creates the release with every file at once (electron-builder's parallel
      # uploads race to create the release and fail with 422 already_exists).
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat .github/release-footer.md >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "Vexa $v" --notes-file notes.md --verify-tag \
            "dist/Vexa-$v-setup.exe" "dist/Vexa-$v-setup.exe.blockmap" dist/latest.yml
