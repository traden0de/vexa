<title>Veltrix Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap">
<style>
:root{
  --bg:#eceef2; --panel:#ffffff; --panel2:#f4f5f8; --sunk:#e4e7ed; --line:#d9dde5; --line2:#c9ced8;
  --text:#191d25; --muted:#5b6372; --faint:#8a92a1;
  --accent:#d9822b; --accent-ink:#9d5610; --accent-soft:#fbead6; --on-accent:#1a1206;
  --ok:#2f8f5b; --ok-soft:#dcf1e4; --warn:#b98309; --warn-soft:#f8ecc8; --bad:#cc4740; --bad-soft:#f8dcda;
  --info:#3a78c7; --info-soft:#dbe8f8; --violet:#7b5bc9; --violet-soft:#e8e0f8; --teal:#1f8e8a; --teal-soft:#d5efee;
  --shadow:0 12px 40px rgba(20,26,40,.18);
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",Consolas,monospace; --brand:"Syne","IBM Plex Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1116; --panel:#151920; --panel2:#1b2029; --sunk:#10141a; --line:#262c37; --line2:#333b48;
    --text:#e5e8ee; --muted:#9199a8; --faint:#667082;
    --accent:#f0a24c; --accent-ink:#f5b56c; --accent-soft:#3a2a17; --on-accent:#1a1206;
    --ok:#4cc083; --ok-soft:#173226; --warn:#e3b341; --warn-soft:#352c14; --bad:#ef6b62; --bad-soft:#3a1c1b;
    --info:#6aa5ec; --info-soft:#18283d; --violet:#a78bf0; --violet-soft:#2a2240; --teal:#4cc4bf; --teal-soft:#15302f;
    --shadow:0 16px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --panel:#151920; --panel2:#1b2029; --sunk:#10141a; --line:#262c37; --line2:#333b48;
  --text:#e5e8ee; --muted:#9199a8; --faint:#667082;
  --accent:#f0a24c; --accent-ink:#f5b56c; --accent-soft:#3a2a17; --on-accent:#1a1206;
  --ok:#4cc083; --ok-soft:#173226; --warn:#e3b341; --warn-soft:#352c14; --bad:#ef6b62; --bad-soft:#3a1c1b;
  --info:#6aa5ec; --info-soft:#18283d; --violet:#a78bf0; --violet-soft:#2a2240; --teal:#4cc4bf; --teal-soft:#15302f;
  --shadow:0 16px 48px rgba(0,0,0,.5);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:16px;height:16px;flex:none}
.tool summary svg{width:12px;height:12px}
.ver svg{width:18px;height:18px;color:var(--faint)}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:60px 1fr;height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-block:12px;gap:4px}
.logo{font-family:var(--brand);font-weight:800;font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--text);color:var(--bg);margin-bottom:14px;letter-spacing:-.5px}
.rail-btn{width:42px;height:42px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative}
.rail-btn:hover{background:var(--panel2);color:var(--text)}
.rail-btn.on{background:var(--accent-soft);color:var(--accent-ink)}
.rail-btn svg{width:20px;height:20px}
.rail-btn .tip{position:absolute;left:52px;white-space:nowrap;background:var(--text);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:20}
.rail-btn:hover .tip{opacity:1}
.rail .spacer{flex:1}
.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.proj{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;border:0;background:none;padding:4px 8px;border-radius:8px}
.proj:hover{background:var(--panel2)}
.proj small{color:var(--faint);font-weight:400;font-family:var(--mono);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--panel2);white-space:nowrap}
.chip svg{width:13px;height:13px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:4px 9px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--text);color:var(--bg)}
.queue{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.statusbar{display:flex;gap:16px;align-items:center;padding:5px 18px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);flex-wrap:wrap}
.statusbar span{display:inline-flex;gap:6px;align-items:center}
.meter{width:90px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
#view{overflow:auto;min-height:0}
.page{padding:22px 24px;max-width:1200px}
.page h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
.page .sub{color:var(--muted);margin:0 0 20px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}

/* board */
.board-head{display:flex;align-items:center;gap:10px;padding:14px 18px 6px;flex-wrap:wrap}
.board-head h2{font-size:16px;margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.board{display:flex;gap:12px;padding:10px 18px 18px;overflow-x:auto;align-items:flex-start;min-height:calc(100% - 60px)}
.col{flex:0 0 272px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:100%}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;font-size:13px}
.col-h .n{color:var(--faint);font-weight:500;font-family:var(--mono);font-size:12px}
.col-h .sw{width:8px;height:8px;border-radius:2px}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;min-height:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
.card .id{font-family:var(--mono)}
.card .ttl{font-weight:500;font-size:13.5px;line-height:1.35}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;letter-spacing:.02em}
.t-feature{background:var(--info-soft);color:var(--info)}
.t-fix{background:var(--bad-soft);color:var(--bad)}
.t-refactor{background:var(--violet-soft);color:var(--violet)}
.t-breaking{background:var(--warn-soft);color:var(--warn)}
.prio{display:inline-flex;gap:1px;align-items:flex-end;height:10px}
.prio i{width:3px;background:var(--line2);border-radius:1px}
.prio i:nth-child(1){height:4px}.prio i:nth-child(2){height:7px}.prio i:nth-child(3){height:10px}
.prio.p1 i:nth-child(1),.prio.p2 i:nth-child(-n+2),.prio.p3 i{background:var(--accent)}
.mini{display:flex;gap:3px}
.mini i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.mini i.d{background:var(--ok)} .mini i.a{background:var(--accent);animation:blink 1.2s infinite} .mini i.f{background:var(--bad)}
@keyframes blink{50%{opacity:.4}}
.card .act{display:flex;gap:6px}
.card-note{font-size:11.5px;padding:6px 8px;border-radius:7px}
.note-warn{background:var(--accent-soft);color:var(--accent-ink)}
.note-bad{background:var(--bad-soft);color:var(--bad)}
.note-ok{background:var(--ok-soft);color:var(--ok)}
.add-inline{border:1px dashed var(--line2);background:none;border-radius:9px;padding:7px;color:var(--faint);font-size:12.5px}
.add-inline:hover{color:var(--text);border-color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:31;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.5}}
.dr-h{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dr-h .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-h h2{margin:0;font-size:18px;text-wrap:balance}
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.step{flex:1 0 92px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
.step .bar{height:4px;border-radius:2px;background:var(--sunk)}
.step.d .bar{background:var(--ok)} .step.a .bar{background:var(--accent);animation:blink 1.2s infinite} .step.f .bar{background:var(--bad)} .step.w .bar{background:var(--info)}
.step b{font-weight:600;color:var(--text);font-size:12px;display:flex;gap:5px;align-items:center}
.step .ag{width:7px;height:7px;border-radius:50%}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--accent);font-weight:500}
.tabs .cnt{font-size:10.5px;background:var(--sunk);border-radius:8px;padding:0 6px;margin-left:4px;color:var(--muted)}
.dr-b{flex:1;overflow:auto;padding:16px 20px}
.dr-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2)}

/* log */
.log{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.ev .ts{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:3px}
.ev .who{font-size:11px;font-weight:600;display:inline-flex;gap:5px;align-items:center;margin-bottom:2px}
.ev .txt{color:var(--text)}
.tool{border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-family:var(--mono);font-size:12px;overflow:hidden}
.tool summary{padding:6px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool .tn{color:var(--accent-ink);font-weight:500}
.tool .res{margin-left:auto;font-size:11px}
.tool pre{margin:0;padding:8px 10px;border-top:1px solid var(--line);background:var(--sunk);white-space:pre-wrap;color:var(--muted);max-height:180px;overflow:auto}
.sysline{font-size:12px;color:var(--faint);border-left:2px solid var(--line2);padding-left:10px}
.caret{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}

/* plan / md */
.md{max-width:68ch;font-size:14px}
.md h3{font-size:15px;margin:18px 0 6px}
.md h3:first-child{margin-top:0}
.md ul,.md ol{padding-left:20px;margin:6px 0}
.md li{margin:3px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.callout{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.callout svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
textarea.inp,input.inp,select.inp{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
textarea.inp{min-height:80px;resize:vertical}

/* diff */
.files{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.fl{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:6px;border:0;background:none;text-align:left}
.fl.on{background:var(--panel2)}
.fl .st{width:16px;font-weight:600}
.fl .add{color:var(--ok)} .fl .del{color:var(--bad)}
.diff{border:1px solid var(--line);border-radius:10px;overflow:auto;font-family:var(--mono);font-size:12px}
.diff table{border-collapse:collapse;width:100%;min-width:560px}
.diff td{padding:0 8px;white-space:pre;vertical-align:top;line-height:1.7}
.diff td.ln{color:var(--faint);text-align:right;width:1%;user-select:none;border-right:1px solid var(--line)}
.diff tr.a td{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.diff tr.r td{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.diff tr.h td{background:var(--info-soft);color:var(--info)}
.diff .fh{padding:7px 10px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}

/* reports */
.reps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.rep{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rep .big{font-size:22px;font-weight:600}
.rep .v{font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.issues{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.issue{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 12px;align-items:start;font-size:13px}
.issue+.issue{border-top:1px solid var(--line)}
.sev{font-size:10.5px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.sev.low{background:var(--info-soft);color:var(--info)} .sev.med{background:var(--warn-soft);color:var(--warn)} .sev.high{background:var(--bad-soft);color:var(--bad)}
.issue .loc{font-family:var(--mono);font-size:11.5px;color:var(--faint)}

/* release */
.bump{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.bump button{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.bump button.on{border-color:var(--accent);background:var(--accent-soft)}
.bump b{font-family:var(--mono);font-size:15px}
.bump span{font-size:11.5px;color:var(--muted)}
.ver{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:22px;font-weight:500}
.ver .old{color:var(--faint);text-decoration:line-through}
.ver .new{color:var(--accent-ink)}
.chlog{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;background:var(--panel2);white-space:pre-wrap}

/* generic panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:13px}
.li:first-child{border-top:0}
.li .sub2{color:var(--faint);font-size:12px;font-family:var(--mono)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard b{font-size:15px}
.pcard .path{font-family:var(--mono);font-size:11.5px;color:var(--faint);word-break:break-all}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.check .ic svg{width:12px;height:12px}
.hero-home{display:flex;gap:18px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.hero-home .wm{font-family:var(--brand);font-weight:800;font-size:34px;letter-spacing:-1px}
.hero-home p{margin:0;color:var(--muted);max-width:60ch}
.gitlog{font-family:var(--mono);font-size:12px}
.gitlog .li{gap:12px}
.graph{width:14px;display:flex;justify-content:center;position:relative;align-self:stretch}
.graph:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line2)}
.graph i{width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);position:relative;margin-top:3px}
.graph.m i{border-color:var(--violet)}
.reftag{font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--teal-soft);color:var(--teal);font-weight:600}
.refbr{font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.agents{display:grid;grid-template-columns:240px 1fr;gap:16px}
.agl{display:flex;flex-direction:column;gap:4px}
.agl button{display:flex;gap:10px;align-items:center;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;text-align:left}
.agl button.on{background:var(--panel);border-color:var(--line)}
.agl .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.agl small{display:block;color:var(--faint);font-size:11.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line2);padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:11.5px;color:var(--text)}
.prompt{font-family:var(--mono);font-size:12.5px;min-height:260px;line-height:1.55}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:16px}
.flow .node{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;color:var(--text)}
.flow .arr{color:var(--faint)}
.set-row{display:grid;grid-template-columns:1fr minmax(200px,280px);gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row p{margin:2px 0 0;color:var(--faint);font-size:12px}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,12,18,.45);padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;overflow:auto}
.dialog header{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.dialog .body{padding:16px 18px}
.dialog footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast svg{width:15px;height:15px;color:var(--ok)}

@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{grid-row:2;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .rail .logo,.rail .spacer,.rail-btn .tip{display:none}
  .topbar{padding:8px 16px}
  .statusbar{display:none}
  .page{padding:16px}
  .agents{grid-template-columns:1fr}
  .set-row{grid-template-columns:1fr}
  .board{padding-inline:16px}
  .board-head{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 developer:`You are the Developer. Implement exactly the approved plan.\nFollow the conventions in CLAUDE.md. Keep changes minimal.\nCommit with Conventional Commits messages.\nIf you receive findings from tester/reviewer/security, fix them all.`,
 tester:`You are the Tester. Detect the project's test command.\nAdd or update tests covering the change, run the full suite.\nReturn JSON: {"passed": bool, "failures": [...], "coverage": number}`,
 reviewer:`You are the Code Reviewer. Review the branch diff vs base.\nCheck correctness, readability, duplication, edge cases.\nReturn JSON: {"verdict": "approve"|"changes_requested", "issues": [...]}`,
 security:`You are the Security Auditor. Inspect the diff for secrets,\ninjection, authz gaps, unsafe deps (run npm audit / pip-audit).\nReturn JSON: {"issues": [{"severity": "low|medium|high|critical", ...}]}`,
 release:`You are the Release Manager. Decide the semver bump from the\ntask type and diff. Update version files and CHANGELOG.md\n(Keep a Changelog format). Commit "chore(release): vX.Y.Z".`
};
const AGCFG={planner:['opus','plan',['Read','Grep','Glob','WebFetch']],developer:['sonnet','acceptEdits',['Read','Edit','Write','Bash','Grep','Glob']],tester:['sonnet','acceptEdits',['Read','Edit','Write','Bash']],reviewer:['opus','plan',['Read','Grep','Glob','Bash(git diff)']],security:['opus','plan',['Read','Grep','Bash(npm audit)']],release:['haiku','acceptEdits',['Read','Edit','Bash(git)']]};
function vAgents(){
  const a=S.agent,c=AGCFG[a];
  return `<div class="page"><h1>${t('ag_title')}</h1><p class="sub">${t('ag_sub')}</p>
   <div class="label" style="margin-bottom:8px">${t('pipeline')}</div>
   <div class="flow">${STAGES.map((s,i)=>`<span class="node"><span class="dot" style="background:${AG[STAGE_AG[s]][0]}"></span>${t('a_'+STAGE_AG[s])}</span>${i<5?`<span class="arr">→</span>`:''}`).join('')}<span class="chip" style="margin-left:8px">${ic('redo')} ${t('s_tests')}/${t('s_review')}/${t('s_security')} → ${t('a_developer')} · ≤3</span></div>
   <div class="agents"><div class="agl">${Object.keys(AG).map(k=>`<button class="${a===k?'on':''}" data-agent="${k}"><span class="av" style="background:${AG[k][1]};color:${AG[k][0]}">${AG[k][2]}</span><span>${t('a_'+k)}<small>${t('ad_'+k)}</small></span></button>`).join('')}</div>
   <div class="panel"><h3><span class="av" style="width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:${AG[a][1]};color:${AG[a][0]}">${AG[a][2]}</span>${t('a_'+a)} <span class="chip mono">resources/agents/${a}.md</span></h3>
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
     <div class="field"><label for="agModel">${t('model')}</label><select class="inp" id="agModel">${['opus','sonnet','haiku'].map(m=>`<option ${m===c[0]?'selected':''}>${m}</option>`).join('')}</select></div>
     <div class="field"><label for="agPerm">${t('perm')}</label><select class="inp" id="agPerm">${['plan','acceptEdits','default'].map(m=>`<option ${m===c[1]?'selected':''}>${m}</option>`).join('')}</select></div></div>
    <div class="field"><label>${t('tools_l')}</label><div class="tools">${['Read','Edit','Write','Bash','Grep','Glob','WebFetch'].map(x=>`<label><input type="checkbox" ${c[2].some(y=>y.startsWith(x))?'checked':''}>${x}</label>`).join('')}</div></div>
    <div class="field"><label for="agPrompt">${t('prompt_l')}</label><textarea class="inp prompt" id="agPrompt">${PROMPTS[a]}</textarea></div>
    <div style="display:flex;gap:8px"><button class="btn primary" data-toast="toast_saved">${t('save')}</button><button class="btn ghost">${t('reset')}</button></div></div></div></div>`;
}
function vProject(){
  return `<div class="page"><h1>${t('proj_title')} · shop-api</h1><p class="sub mono" style="font-size:12px">D:\\Projects\\shop-api</p>
   <div class="grid2" style="grid-template-columns:minmax(0,2fr) minmax(260px,1fr)">
    <div class="panel"><h3>${ic('doc')} ${t('claude_md')}<span class="grow"></span><button class="btn sm">${ic('bolt')}${t('create_md')}</button><button class="btn sm">${ic('edit')}</button></h3>
     <div class="chlog" style="font-size:12.5px"># shop-api

REST API for the shop. Node 24, TypeScript, Express, Postgres.

## Commands
- \`npm run dev\` — start with watch
- \`npm test\` — vitest, must pass before commit
- \`npm run lint\` — eslint + prettier

## Conventions
- Conventional Commits
- No default exports; one module per file
- DB access only via src/db/repositories/*</div></div>
    <div class="panel"><h3>${ic('tag')} ${t('prev_versions')}</h3><div class="list">${[['v1.4.2','VX-10','2026-09-19'],['v1.4.1','VX-9','2026-09-17'],['v1.4.0','VX-11','2026-09-15'],['v1.3.0','VX-6','2026-09-08'],['v1.2.1','VX-5','2026-09-02']].map(v=>`<div class="li"><span class="reftag">${v[0]}</span><span class="mono" style="font-size:12px">${v[1]}</span><span class="grow"></span><span class="sub2">${v[2]}</span></div>`).join('')}</div></div>
   </div></div>`;
}
function vSettings(){
  return `<div class="page" style="max-width:820px"><h1>${t('set_title')}</h1><p class="sub">%APPDATA%\\Veltrix\\veltrix.db</p>
   <div class="panel">
    <div class="set-row"><div>${t('lang')}</div><div class="seg"><button data-lang="ru" class="${S.lang==='ru'?'on':''}">Русский</button><button data-lang="en" class="${S.lang==='en'?'on':''}">English</button></div></div>
    <div class="set-row"><div>${t('theme')}</div><div class="seg">${['sys','light','dark'].map(m=>`<button data-theme-set="${m}" class="${S.themeMode===m?'on':''}">${t('theme_'+(m==='sys'?'sys':m))}</button>`).join('')}</div></div>
    <div class="set-row"><div>${t('max_iter')}<p>${t('set_iter_d')}</p></div><input class="inp" type="number" id="setIter" value="3" min="1" max="10"></div>
    <div class="set-row"><div>${t('set_base')}<p>${t('set_base_d')}</p></div><select class="inp" id="setBase"><option>main</option><option>develop</option></select></div>
    <div class="set-row"><div>${t('set_model')}</div><select class="inp" id="setModel"><option>sonnet</option><option>opus</option><option>haiku</option></select></div>
    <div class="set-row"><div>${t('set_auto')}<p>${t('set_auto_d')}</p></div><div class="seg"><button class="on">${t('on')}</button><button>${t('off')}</button></div></div>
    <div class="set-row"><div>${t('set_path')}<p>${t('set_path_d')}</p></div><input class="inp mono" id="setPath" value="%USERPROFILE%\\.local\\bin\\claude.exe"></div>
   </div></div>`;
}

/* ---------- modal ---------- */
let ntType='feature',ntPrio=2;
function openModal(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal" data-mclose><form class="dialog" id="ntForm">
   <header>${t('nt_title')}</header><div class="body">
    <div class="field"><label for="ntName">${t('nt_name')}</label><input class="inp" id="ntName" placeholder="${t('nt_ph')}" required></div>
    <div class="field"><label for="ntDesc">${t('nt_desc')}</label><textarea class="inp" id="ntDesc" placeholder="${t('nt_dph')}"></textarea></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
     <div class="field"><label>${t('nt_type')}</label><div class="seg" id="ntType">${['feature','fix','refactor','breaking'].map(x=>`<button type="button" data-v="${x}" class="${ntType===x?'on':''}">${x}</button>`).join('')}</div></div>
     <div class="field"><label>${t('nt_prio')}</label><div class="seg" id="ntPrio">${[[1,'low'],[2,'normal'],[3,'high']].map(([v,k])=>`<button type="button" data-v="${v}" class="${ntPrio===v?'on':''}">${t(k)}</button>`).join('')}</div></div></div>
   </div><footer><button type="button" class="btn ghost" data-mclose>${t('cancel')}</button><button type="submit" class="btn" data-dest="backlog">${t('save_backlog')}</button><button type="submit" class="btn primary" data-dest="queue">${t('save_queue')}</button></footer></form></div>`;
  setTimeout(()=>document.getElementById('ntName').focus(),0);
}
function toast(k){
  const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${ic('check',2.4)}${t(k)}</div>`;
  clearTimeout(toast.h);toast.h=setTimeout(()=>r.innerHTML='',2400);
}

/* ---------- render + events ---------- */
function render(){
  document.documentElement.lang=S.lang;
  renderRail();renderTop();renderStatus();
  const v=document.getElementById('view');
  v.innerHTML={home:vHome,board:vBoard,git:vGit,agents:vAgents,project:vProject,settings:vSettings}[S.view]();
  renderDrawer();
}
function applyTheme(m){S.themeMode=m;const r=document.documentElement;if(m==='sys')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m)}
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g('[data-view]')){S.view=el.dataset.view;S.sel=null;render();return}
  if(el=g('[data-lang]')){S.lang=el.dataset.lang;try{localStorage.setItem('vx_lang',S.lang)}catch(_){}render();return}
  if(g('#themeBtn')){const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);applyTheme(dark?'light':'dark');render();return}
  if(el=g('[data-theme-set]')){applyTheme(el.dataset.themeSet);render();return}
  if(g('#qbtn')){S.queue=!S.queue;render();return}
  if(g('#newTask')||g('#addInline')){openModal();return}
  if(el=g('[data-send]')){const x=TASKS.find(z=>z.id===el.dataset.send);x.col='queue';S.sel=null;render();toast('toast_moved');return}
  if(el=g('[data-open]')){S.sel=el.dataset.open;S.tab=el.dataset.tab||'log';render();return}
  if(el=g('[data-card]')){const x=TASKS.find(z=>z.id===el.dataset.card);S.sel=x.id;S.tab=x.col==='approval'?'plan':x.col==='review'?'reports':'log';render();return}
  if(g('[data-close]')){S.sel=null;render();return}
  if(el=g('[data-tab-btn]')){S.tab=el.dataset.tabBtn;renderDrawer();return}
  if(el=g('[data-file]')){S.file=+el.dataset.file;renderDrawer();return}
  if(el=g('[data-bump]')){S.bump=el.dataset.bump;renderDrawer();return}
  if(el=g('[data-agent]')){S.agent=el.dataset.agent;render();return}
  if(el=g('[data-toast]')){toast(el.dataset.toast);return}
  if(el=g('[data-act]')){const x=TASKS.find(z=>z.id===S.sel);const a=el.dataset.act;
    if(a==='approve'){x.col='progress';x.st=['d','a','','','',''];x.iter=1;x.time='2:14';S.sel=null;render();toast('toast_approved')}
    else if(a==='accept'){x.col='done';x.ver={patch:'1.4.3',minor:'1.5.0',major:'2.0.0'}[S.bump];S.sel=null;render();toast('toast_merge')}
    else if(a==='rework'){x.col='progress';x.st=['d','a','','','',''];x.iter=1;S.sel=null;render();toast('toast_rework')}
    else if(a==='reject'){TASKS=TASKS.filter(z=>z!==x);S.sel=null;render();toast('toast_reject')}
    else if(a==='retry'){x.col='queue';S.sel=null;render();toast('toast_moved')}
    else if(a==='stop'){S.queue=false;render()}
    else if(a==='replan'){S.tab='plan';renderDrawer();document.getElementById('replanTxt')?.focus()}
    return}
  const mm=e.target.closest('#ntType button,#ntPrio button');
  if(mm){const grp=mm.parentElement;[...grp.children].forEach(b=>b.classList.toggle('on',b===mm));if(grp.id==='ntType')ntType=mm.dataset.v;else ntPrio=+mm.dataset.v;return}
  if(e.target.matches('[data-mclose]')){document.getElementById('modalRoot').innerHTML='';return}
});
let submitDest='backlog';
document.addEventListener('click',e=>{const b=e.target.closest('[data-dest]');if(b)submitDest=b.dataset.dest},true);
document.addEventListener('submit',e=>{
  if(e.target.id!=='ntForm')return;e.preventDefault();
  const n=Math.max(...TASKS.map(x=>+x.id.split('-')[1]))+1;
  const name=document.getElementById('ntName').value.trim();
  TASKS.push({id:'VX-'+n,title:{ru:name,en:name},type:ntType,p:ntPrio,col:submitDest});
  document.getElementById('modalRoot').innerHTML='';S.view='board';render();toast('toast_created');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modalRoot').innerHTML)document.getElementById('modalRoot').innerHTML='';else if(S.sel){S.sel=null;render()}}});
/* drag & drop */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(c){dragId=c.dataset.card;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}}});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-col]');if(c&&dragId){e.preventDefault();document.querySelectorAll('.col.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop')}});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-col]');if(c&&dragId){e.preventDefault();const x=TASKS.find(z=>z.id===dragId);x.col=c.dataset.col;dragId=null;render();toast('toast_moved')}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop'))});

render();
</script>
